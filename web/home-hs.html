<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/web_icon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang chủ học sinh · Ngữ văn 12</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="page-shell">
  <div id="header-slot"></div>
  <main class="home-hero" aria-label="Trang chủ học sinh">
    <img src="assets/home_image.png" alt="Ngữ văn 12 — trang chủ học sinh" />
  </main>
  <div id="footer-slot"></div>
  <script type="module">
    import { mountChrome } from "./js/shell.js";
    import { watchAuth } from "./js/auth.js";
    mountChrome({ active: "home", role: "student", who: "Học sinh" });
    watchAuth((user, profile) => {
      if (!user) return;
      const name = (profile && profile.hoTen) || "Học sinh";
      mountChrome({ active: "home", role: "student", who: name });
    });
  </script>
</body>
</html>
