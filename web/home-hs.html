<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang chủ học sinh · Ngữ văn 12</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="page-shell">
  <div id="header-slot"></div>
  <main class="wrap">
    <h1>Việc tối nay</h1>
    <div class="accent"></div>
    <div class="pillars">
      <a class="fn-box" href="bai-giang-hs.html"><div class="kicker">Bài giảng</div><h2>Bài giảng</h2><p>Theo tuần / thẻ cô đã đăng.</p></a>
      <a class="fn-box" href="luyen-tap-hs.html"><div class="kicker">Luyện tập</div><h2>Đề và mẫu</h2><p>Mẫu mở sau khi nộp.</p></a>
    </div>
  </main>
  <div id="footer-slot"></div>
  <script type="module">
    import { mountChrome } from "./js/shell.js";
    import { watchAuth } from "./js/auth.js";
    mountChrome({ active: "home", role: "student", who: "Học sinh" });
    watchAuth((user, profile) => {
      if (!user) return;
      const name = (profile && profile.hoTen) || "Học sinh";
      mountChrome({ active: "home", role: "student", who: name });
    });
  </script>
</body>
</html>
