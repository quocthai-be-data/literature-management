<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="assets/web_icon.jpg" type="image/jpeg"><title>Đồng hồ học tập</title><link rel="stylesheet" href="css/app.css"></head>
<body class="page-shell clock-page-shell"><div id="header-slot"></div><main class="clock-page wrap"><section id="clock-picker" class="clock-picker"><div class="clock-heading"><p class="section-label">Học tập tập trung</p><h1>Đồng hồ</h1><p class="sub">Chọn công cụ phù hợp với phiên học của bạn.</p></div><div class="clock-mode-grid"><button class="clock-mode-card" data-mode="stopwatch" type="button"><span class="clock-mode-icon">⏱</span><b>Bấm giờ</b><small>Đo thời gian học từ 00:00:00:00</small></button><button class="clock-mode-card" data-mode="countdown" type="button"><span class="clock-mode-icon">◷</span><b>Đếm ngược</b><small>Chọn nhanh hoặc tự đặt thời gian</small></button><button class="clock-mode-card" data-mode="exam" type="button"><span class="clock-mode-icon">◉</span><b>Đếm ngược ngày thi</b><small>Đếm đến 11/06/2027</small></button></div></section>
<section id="clock-setup" class="clock-setup hidden"><button class="back-link" id="back-to-picker" type="button">‹ Quay lại</button><div id="setup-content"></div></section>
<section id="clock-focus" class="clock-focus hidden" aria-live="polite"><button id="fullscreen-clock" class="clock-fullscreen" type="button" aria-label="Mở toàn màn hình">⛶</button><div class="clock-focus-inner"><p class="section-label" id="focus-kicker">Bấm giờ</p><div class="clock-ring"><div class="clock-ring-inner"><span id="focus-label">Đồng hồ học tập</span><strong id="focus-time">00:00:00:00</strong><small id="focus-progress"></small></div></div><div class="clock-controls"><button class="clock-control primary" id="clock-pause" type="button">Bắt đầu</button><button class="clock-control reset" id="clock-reset" type="button">Đặt lại</button><button class="clock-control stop" id="clock-stop" type="button">Dừng</button></div></div></section>
</main><div id="footer-slot"></div><script type="module" src="js/dong-ho.js"></script></body></html>
