<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/web_icon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trang chủ giáo viên · Ngữ văn 12</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="page-shell">
  <div id="header-slot"></div>
  <main class="wrap">
    <h1>Việc hôm nay</h1>
    <div class="accent"></div>
    <p class="sub">Home chỉ điều phối. Soạn nội dung ở Bài giảng / Luyện tập.</p>
    <div class="grid-4">
      <div class="stat"><b>2</b><small>Lớp đang dạy</small></div>
      <div class="stat"><b>1</b><small>Bài giảng nháp</small></div>
      <div class="stat"><b>12</b><small>Bài chưa chấm</small></div>
      <div class="stat"><b>3</b><small>Đề sắp hết hạn</small></div>
    </div>
    <div class="pillars">
      <a class="fn-box" href="bai-giang.html"><div class="kicker">Trụ 1</div><h2>Bài giảng</h2><p>Tuần / thẻ và link bài cô đăng.</p></a>
      <a class="fn-box" href="luyen-tap.html"><div class="kicker">Trụ 2</div><h2>Luyện tập</h2><p>Đề giao, tự luyện, khung mẫu.</p></a>
    </div>
  </main>
  <div id="footer-slot"></div>
  <script type="module">
    import { mountChrome } from "./js/shell.js";
    import { watchAuth } from "./js/auth.js";
    mountChrome({ active: "home", role: "teacher", who: "Giáo viên" });
    watchAuth((user, profile) => {
      if (!user) return;
      const name = (profile && profile.hoTen) || user.email || "Giáo viên";
      mountChrome({ active: "home", role: "teacher", who: name });
    });
  </script>
</body>
</html>
