<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="assets/web_icon.jpg" type="image/jpeg"><title>Trang ch&#7911; gi&#225;o vi&#234;n</title><link rel="stylesheet" href="css/app.css"></head>
<body class="page-shell teacher-home-page"><div id="header-slot"></div><main class="teacher-dashboard wrap">
<section class="dashboard-top"><article class="school-week card"><div class="section-label">L&#7883;ch l&#224;m vi&#7879;c</div><div class="week-stepper"><button class="icon-control" id="week-prev" type="button" aria-label="Tu&#7847;n tr&#432;&#7899;c">&lsaquo;</button><label>Tu&#7847;n &#7903; tr&#432;&#7901;ng<input id="school-week" type="number" min="1"></label><button class="icon-control" id="week-next" type="button" aria-label="Tu&#7847;n sau">&rsaquo;</button></div><div class="calendar-heading" id="calendar-heading"></div><div class="mini-calendar" id="mini-calendar"></div></article>
<section class="grading-overview card"><div class="panel-heading"><div><div class="section-label">Theo d&#245;i ch&#7845;m b&#224;i</div><h1>B&#7843;ng ch&#7845;m b&#224;i</h1></div><button class="btn" id="open-grading" type="button">M&#7903; b&#7843;ng ch&#7845;m b&#224;i</button></div><div class="grading-cards"><button class="grading-stat pending" data-status="pending"><span>C&#7847;n ch&#7845;m</span><b id="pending-count">0</b><small>&#272;&#227; h&#7871;t h&#7841;n n&#7897;p</small></button><button class="grading-stat receiving" data-status="receiving"><span>&#272;ang nh&#7853;n b&#224;i</span><b id="receiving-count">0</b><small>Ch&#432;a t&#7899;i h&#7841;n n&#7897;p</small></button><button class="grading-stat done" data-status="done"><span>&#272;&#227; ch&#7845;m</span><b id="done-count">0</b><small>&#272;&#227; ho&#224;n th&#224;nh ch&#7845;m</small></button></div></section></section>
<section class="dashboard-notes card"><div class="note-tabs"><button class="note-tab on" data-note-tab="note">Ghi ch&#250;</button><button class="note-tab" data-note-tab="todo">Todo list</button></div><div class="note-surface"><div id="note-panel"><textarea id="teacher-note" placeholder="Ghi ch&#250; c&#7911;a gi&#225;o vi&#234;n"></textarea><p class="save-state" id="note-state"></p></div><div id="todo-panel" class="hidden"><div id="todo-list" class="todo-list"></div><button id="add-todo" class="add-todo" type="button" aria-label="Th&#234;m vi&#7879;c c&#7847;n l&#224;m">+</button></div></div></section></main>
<div id="grading-modal" class="modal-back hidden"><section class="grading-modal modal"><div class="panel-heading"><h2>B&#7843;ng ch&#7845;m b&#224;i</h2><button class="icon-control" id="close-grading">&times;</button></div><div class="grading-tools"><div class="status-tabs"><button class="chip on" data-modal-status="pending">C&#7847;n ch&#7845;m</button><button class="chip" data-modal-status="receiving">&#272;ang nh&#7853;n b&#224;i</button><button class="chip" data-modal-status="done">&#272;&#227; ch&#7845;m</button></div><label class="filter-label">L&#7885;c th&#7867;<select id="grading-filter"><option value="all">T&#7845;t c&#7843;</option><option value="doc-hieu">&#272;&#7885;c - hi&#7875;u</option><option value="nlxh">Ngh&#7883; lu&#7853;n x&#227; h&#7897;i</option><option value="nlvh">Ngh&#7883; lu&#7853;n v&#259;n h&#7885;c</option><option value="de-nam">&#272;&#7873; thi c&#225;c n&#259;m</option><option value="bai-tap">B&#224;i t&#7853;p</option></select></label></div><div id="grading-list" class="grading-list"></div></section></div><div id="footer-slot"></div><script type="module" src="js/home.js"></script></body></html>
