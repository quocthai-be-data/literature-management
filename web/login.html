<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/web_icon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập · Ngữ văn 12</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="page-shell auth-page">
  <div id="header-slot"></div>
  <div class="login-split">
    <div class="login-visual">
      <img src="assets/background_log_in.png" alt="" />
    </div>
    <div class="login-panel">
      <div class="login-form">
        <h1>Đăng nhập</h1>
        <p class="sub">Tài khoản do giáo viên cấp</p>
        <label>Email</label>
        <input id="email" type="email" autocomplete="username" />
        <label>Mật khẩu</label>
        <input id="password" type="password" autocomplete="current-password" />
        <p class="err" id="err"></p>
        <button class="btn" type="button" id="btn-login">Đăng nhập</button>
        <p class="sub" style="margin-top:12px"><a href="quen-mat-khau.html">Quên mật khẩu?</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
