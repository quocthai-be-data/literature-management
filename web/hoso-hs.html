<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="assets/web_icon.jpg" type="image/jpeg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thông tin học sinh</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/profile-visual.css" />
</head>
<body class="page-shell">
  <div id="header-slot"></div>
  <div class="profile-split">
    <section class="profile-form">
      <h1>Thông tin học sinh</h1>
      <div class="accent"></div>
      <form id="pf">
        <label>Tên</label>
        <input name="hoTen" />
        <label>SĐT</label>
        <input name="sdt" />
        <label>Lớp</label>
        <input name="lop" />
        <label>Gmail</label>
        <input name="gmail" type="email" />
        <p class="err" id="msg"></p>
        <button class="btn" type="submit" style="margin-top:12px">Lưu</button>
        <p style="margin-top:22px"><a class="btn ghost" href="login.html" id="out">Đăng xuất</a></p>
      </form>
    </section>
    <aside class="profile-visual" id="bg-info"></aside>
  </div>
  <div id="footer-slot"></div>
  <script type="module">
    import { bootProfile } from "./js/profile-page.js";
    bootProfile({ role: "student", titleWho: "Học sinh" });
  </script>
</body>
</html>
